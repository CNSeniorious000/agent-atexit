name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [26]
        include:
          - os: ubuntu-latest
            node: 18
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: git diff --exit-code -- plugins/atexit/dist
      - run: bun run artifacts
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 26
        with:
          name: installable-artifacts
          path: |
            artifacts/agent-atexit-kimi.zip
            artifacts/agent-atexit-opencode-*.tgz
            artifacts/agent-atexit-dsh-*.tgz

  compatibility:
    name: Adapter compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current pinned SDKs are covered by check; keep previously supported APIs here.
          - name: DSH 0.1.1-rc.2
            tests: adapters/dsh/test/
            packages: '@deepseek-ai/dsh-agent@0.1.1-rc.2 @deepseek-ai/dsh-tools@0.1.1-rc.2 @deepseek-ai/dsh-attachment@0.1.1-rc.2 @deepseek-ai/cordis@4.0.1'
          - name: DSH 0.2.1-rc.2
            tests: adapters/dsh/test/
            packages: '@deepseek-ai/dsh-agent@0.2.1-rc.2 @deepseek-ai/dsh-tools@0.2.1-rc.2 @deepseek-ai/dsh-attachment@0.2.1-rc.2 @deepseek-ai/cordis@4.0.5'
          - name: DSH 0.2.2-rc.1
            tests: adapters/dsh/test/
            packages: '@deepseek-ai/dsh-agent@0.2.2-rc.1 @deepseek-ai/dsh-tools@0.2.2-rc.1 @deepseek-ai/dsh-attachment@0.2.2-rc.1 @deepseek-ai/cordis@4.1.0'
          - name: DSH 0.2.2-rc.2
            tests: adapters/dsh/test/
            packages: '@deepseek-ai/dsh-agent@0.2.2-rc.2 @deepseek-ai/dsh-tools@0.2.2-rc.2 @deepseek-ai/dsh-attachment@0.2.2-rc.2 @deepseek-ai/cordis@4.1.0'
          - name: OpenCode v1 1.18.27
            tests: adapters/opencode/test/
            packages: '@opencode-ai/plugin@1.18.27'
          - name: OpenCode v2 2.1.4
            tests: adapters/opencode/test/
            packages: '@opencode/plugin@2.1.4'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Install compatibility SDKs
        env:
          HOST_PACKAGES: ${{ matrix.packages }}
        run: |
          read -r -a packages <<< "$HOST_PACKAGES"
          bun add --dev --exact --ignore-scripts "${packages[@]}"
      - run: bun run typecheck
      - run: bun run build
      - run: bun test ${{ matrix.tests }}
