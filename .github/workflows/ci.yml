name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: installable-artifacts
          path: |
            artifacts/agent-atexit-kimi.zip
            artifacts/agent-atexit-opencode-0.1.0.tgz
            artifacts/agent-atexit-dsh-0.1.0.tgz

