name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: bun run check
      - run: git diff --exit-code -- plugins/atexit/dist
      - run: bun run artifacts
      - name: Create checksums
        run: cd artifacts && sha256sum agent-atexit-kimi.zip agent-atexit-opencode-*.tgz agent-atexit-dsh-*.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/agent-atexit-kimi.zip
            artifacts/agent-atexit-opencode-*.tgz
            artifacts/agent-atexit-dsh-*.tgz
            artifacts/SHA256SUMS
